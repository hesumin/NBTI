name: Deploy SipTI to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "sip-ti/**"
      - ".github/workflows/deploy-sip-ti.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure SipTI project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages project create sip-ti --production-branch main || echo "sip-ti project already exists"

      - name: Deploy SipTI
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: sip-ti
          directory: ./sip-ti
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
